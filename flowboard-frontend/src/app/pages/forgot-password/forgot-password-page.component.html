<div class="auth">
  <div class="auth__bg"></div>

  <div class="auth__wrap">
    <div class="brand">
      <div class="brand__logo" aria-hidden="true">F</div>
      <div class="brand__text">
        <div class="brand__title">Flowboard</div>
        <div class="brand__subtitle">Recover your account</div>
      </div>
    </div>

    <div class="card">
      <div class="card__top">
        <h2 class="card__title">Forgot password</h2>
        <p class="card__hint">
          Enter your email and we’ll send you a reset link.
        </p>
      </div>

      <form class="form" (ngSubmit)="onSubmit()">
        <label class="field">
          <span class="field__label">Email</span>
          <input
            class="field__input"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            required
          />
        </label>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          <span *ngIf="!loading">Send reset link</span>
          <span *ngIf="loading">Sending…</span>
        </button>

        <p class="success" *ngIf="message">{{ message }}</p>
        <p class="error" *ngIf="error">{{ error }}</p>

        <p class="row">
          <a class="link" routerLink="/login">Back to login</a>
        </p>
      </form>
    </div>

    <div class="footnote">
      Didn’t receive an email? Check spam or try again.
    </div>
  </div>
</div>
