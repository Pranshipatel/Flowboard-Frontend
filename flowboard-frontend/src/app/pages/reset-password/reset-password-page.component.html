<div class="auth">
  <div class="auth__bg"></div>

  <div class="auth__wrap">
    <div class="brand">
      <div class="brand__logo" aria-hidden="true">F</div>
      <div class="brand__text">
        <div class="brand__title">Flowboard</div>
        <div class="brand__subtitle">Reset your password</div>
      </div>
    </div>

    <div class="card">
      <div class="card__top">
        <h2 class="card__title">Reset password</h2>
        <p class="card__hint">Choose a new password for your account.</p>
      </div>

      <div class="form">
        <p class="error" *ngIf="!token">
          Missing token in URL. Please open the reset link from your email.
        </p>

        <form (ngSubmit)="onSubmit()" *ngIf="token">
          <label class="field">
            <span class="field__label">New password</span>
            <input
              class="field__input"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Enter new password"
              [(ngModel)]="password"
              required
            />
          </label>

          <button class="btn btn--primary" type="submit" [disabled]="loading">
            <span *ngIf="!loading">Update password</span>
            <span *ngIf="loading">Updating…</span>
          </button>
        </form>

        <p class="success" *ngIf="message">{{ message }}</p>
        <p class="error" *ngIf="error">{{ error }}</p>

        <p class="row">
          <a class="link" routerLink="/login">Back to login</a>
        </p>
      </div>
    </div>

    <div class="footnote">
      If the link expired, request a new one from <span class="muted">Forgot password</span>.
    </div>
  </div>
</div>
